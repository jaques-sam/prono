name: Github Pages

# Runs on every push to main: keeps the GitHub Pages app in sync with the main branch (kr8ium.com is deployed from release, see kr8ium.yml).
on:
  push:
    branches:
      - main
# to only run when you do a new github release, comment out above part and uncomment the below trigger.
# on:
#   release:
#     types:
#       - published

permissions:
  contents: write # for committing to gh-pages branch.

jobs:
  build-github-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4 # repo checkout
      - name: Build
        uses: ./.github/actions/trunk-build
        with:
          # Resolves to the github project page: username.github.io/repo_name
          # (for a user/organization page, remove the repo name part).
          public-url: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: app/dist
          # this option will not maintain any history of your previous pages deployment
          # set to false if you want all page build to be committed to your gh-pages branch history
          single-commit: true
