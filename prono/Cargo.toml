[package]
name = "prono"
version = "0.1.0"
edition = "2024"

# Server-side core: submit/results use cases, the repository (MySQL and
# in-memory) and the database configuration. Used by the backend and the CLI.
[dependencies]
prono_api = { path = "../api" }

async-trait = "0.1.92"
dirs = "6.0.0"
log = "0.4.35"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.8.6", default-features = false, features = ["mysql", "runtime-tokio", "uuid"] }
thiserror = "2.0.21"
toml = "0.9.12"
uuid = "1.29.2"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt"] }
