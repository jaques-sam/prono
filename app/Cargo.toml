[package]
name = "prono-app"
version = "0.1.0"
authors = ["Sam Jaques <sam.jaques@me.com>"]
edition = "2024"
include = ["LICENSE-APACHE", "LICENSE-MIT", "**/*.rs", "Cargo.toml"]
rust-version = "1.95"

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[dependencies]
prono_api = { path = "../api" }

egui = "0.36.0"
eframe = { version = "0.36.0", default-features = false, features = [
    "accesskit",     # Make egui compatible with screen readers. NOTE: adds a lot of dependencies.
    "default_fonts", # Embed the default egui fonts.
    "glow",          # Use the glow rendering backend. Alternative: "wgpu".
    "persistence",   # Enable restoring app state when restarting the app.
    "wayland",       # To support Linux (and CI)
] }
ehttp = { version = "0.7.3", features = ["json"] }
log = "0.4.35"
serde = { version = "1.0.229", features = ["derive"] }

# native:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = "6.0.0"
env_logger = "0.11.11"
uuid = { version = "1", features = ["v4"] }

# web:
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4.80"
web-sys = "0.3.107"
uuid = { version = "1", features = ["v4", "js"] }

[dev-dependencies]
prono = { path = "../prono" }

cucumber = "0.23.0"
egui_kittest = "0.36.2"
futures = { version = "0.3.34", default-features = false, features = ["executor"] }

# UI component tests: Gherkin scenarios driving the egui UI headlessly.
[[test]]
name = "ui"
path = "tests/ui/main.rs"
harness = false
