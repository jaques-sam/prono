[package]
name = "prono_api"
version = "0.1.0"
edition = "2024"

# Shared by every binary, including the wasm web app: keep it free of
# native-only dependencies.
[dependencies]
chrono = "0.4.45"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = { version = "1.29.2", features = ["v5"] }
